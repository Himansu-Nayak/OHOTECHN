<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 185" width="840" height="185">
  <defs>
    <!-- Rich 3D Electric Blue Gradients -->
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="45%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0022AA" />
    </linearGradient>

    <linearGradient id="blueGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001188" />
      <stop offset="50%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="lineLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0044CC" />
    </linearGradient>

    <linearGradient id="lineRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0044CC" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- ── 1. CLEAR & DISTINCT 'O H O' 3D BRANDMARK ── -->
    
    <!-- FIRST 'O' (Ribbon Ring) -->
    <g transform="translate(0, 0)">
      <path d="
        M 55,30 
        C 25,30 5,52 5,85 
        C 5,118 25,140 55,140 
        C 85,140 105,118 105,85 
        C 105,52 85,30 55,30 Z
        M 55,54
        C 70,54 82,67 82,85
        C 82,103 70,116 55,116
        C 40,116 28,103 28,85
        C 28,67 40,54 55,54 Z
      " fill="url(#blueGrad1)" />
      <!-- 3D Ribbon Shading Arc -->
      <path d="
        M 12,85 
        C 12,58 30,35 55,35 
        C 78,35 95,50 100,75 
        C 90,58 75,46 55,46 
        C 36,46 23,62 23,85 
        C 23,108 36,124 55,124 
        C 75,124 90,112 100,95 
        C 95,118 78,135 55,135 
        C 30,135 12,112 12,85 Z
      " fill="url(#blueGrad2)" opacity="0.9" />
    </g>

    <!-- MIDDLE 'H' (Distinct Bold 3D Pillars & Crossbar) -->
    <g transform="translate(112, 0)">
      <!-- Left Vertical Pillar -->
      <rect x="0" y="32" width="18" height="106" rx="9" fill="url(#blueGrad1)" />
      <!-- Right Vertical Pillar -->
      <rect x="36" y="32" width="18" height="106" rx="9" fill="url(#blueGrad1)" />
      <!-- Horizontal Connecting Bar -->
      <rect x="14" y="76" width="26" height="18" rx="4" fill="url(#blueGrad2)" />
    </g>

    <!-- SECOND 'O' (Ribbon Ring + Circuit Core) -->
    <g transform="translate(174, 0)">
      <path d="
        M 55,30 
        C 25,30 5,52 5,85 
        C 5,118 25,140 55,140 
        C 85,140 105,118 105,85 
        C 105,52 85,30 55,30 Z
        M 55,54
        C 70,54 82,67 82,85
        C 82,103 70,116 55,116
        C 40,116 28,103 28,85
        C 28,67 40,54 55,54 Z
      " fill="url(#blueGrad1)" />
      <!-- Inner Circuit Node Core -->
      <circle cx="55" cy="85" r="22" fill="#FFFFFF" />
      <circle cx="45" cy="94" r="3.5" fill="#0055FF" />
      <circle cx="63" cy="74" r="3.5" fill="#0055FF" />
      <circle cx="69" cy="98" r="3.5" fill="#0055FF" />
      <path d="M 33,102 L 45,94 L 63,74 M 45,94 L 69,98" stroke="#0055FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Floating Cyan Digital Pixel Cubes (Top-Right Scatter) -->
    <g transform="translate(278, 0)">
      <rect x="10" y="52" width="11" height="11" rx="2" fill="#00D2FF" />
      <rect x="25" y="36" width="10" height="10" rx="2" fill="#0077FF" />
      <rect x="40" y="22" width="8" height="8" rx="1.5" fill="#00E5FF" />
      <rect x="52" y="10" width="7" height="7" rx="1" fill="#00D2FF" />
      <rect x="14" y="32" width="8" height="8" rx="1.5" fill="#0099FF" />
      <rect x="30" y="54" width="7" height="7" rx="1" fill="#00D2FF" />
      <rect x="44" y="38" width="6" height="6" rx="1" fill="#00E5FF" />
    </g>

    <!-- Vertical Separation Bar -->
    <line x1="345" y1="25" x2="345" y2="142" stroke="#061229" stroke-width="2.5" opacity="0.9" />

    <!-- ── 2. BOLD NAVY 'TECH' TYPOGRAPHY ── -->
    <g transform="translate(365, 124)">
      <text font-family="system-ui, -apple-system, 'Inter', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#061229" letter-spacing="3">TECH</text>
      <!-- Stylized Horizontal Cutout on E -->
      <rect x="94" y="-47" width="40" height="9" fill="#0066FF" />
    </g>

    <!-- ── 3. BOTTOM TAGLINE WITH FLANKING ACCENT LINES ── -->
    <g transform="translate(0, 168)">
      <line x1="20" y1="0" x2="175" y2="0" stroke="url(#lineLeft)" stroke-width="3" stroke-linecap="round" />
      <text x="415" y="6" text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="800" font-size="20" fill="#061229" letter-spacing="0.5">
        Innovative Software. Smarter Businesses.
      </text>
      <line x1="655" y1="0" x2="810" y2="0" stroke="url(#lineRight)" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>