spring.application.name=backend-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.mail.host=
spring.flyway.enabled=false
spring.jackson.serialization.fail-on-empty-beans=false
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.ohotech.backend=INFO
