spring.application.name=backend-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.mail.host=
spring.jackson.serialization.fail-on-empty-beans=false
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.ohotech.backend=INFO

# Gemini Mock Test Config
gemini.api.key=test-key-mock
gemini.api.model=gemini-1.5-flash
gemini.api.embedding-model=text-embedding-004
gemini.api.timeout-ms=5000
gemini.api.max-output-tokens=1024
gemini.api.temperature=0.7
gemini.api.rate-limit-per-minute=1000

# Firebase Test Mock
app.firebase.mock-enabled=true

# Test Mode Flags for Unit Testing
app.razorpay.test-mode=true
app.auth.require-email-verification=true

