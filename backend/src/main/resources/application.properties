spring.application.name=backend
server.port=${PORT:8080}

# Database Connection (PostgreSQL 17 on Port 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/OHOTECH
spring.datasource.username=postgres
spring.datasource.password=ohotech@2404
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Jackson JSON Serialization Settings
spring.jackson.serialization.fail-on-empty-beans=false

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.ohotech.backend=DEBUG
