spring.application.name=backend
server.port=${PORT:8080}

# Database Connection (PostgreSQL 17 on Port 5432)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/OHOTECH}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:7846805157@Raja}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.ohotech.backend=DEBUG

