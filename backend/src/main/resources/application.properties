spring.application.name=backend
server.port=${PORT:8080}

# Database Connection (PostgreSQL 17 on Port 5432 with Env Overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/OHOTECH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Security & JWT Configuration (Environment Override Ready)
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentPhaseThatIsLongEnoughAndSecure32Bytes!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# SMTP / Email Configuration (Resend / Custom SMTP Environment Override Ready)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.from-email=${SPRING_MAIL_FROM_ADDRESS:onboarding@resend.dev}
app.mail.from-name=${MAIL_FROM_NAME:OHO TECHN Notification}

# Payment Gateway Configuration (Razorpay Environment Override Ready)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Webhook Ad Integration Secrets (Environment Override Ready)
meta.app-secret=${META_APP_SECRET:}
meta.verify-token=${META_VERIFY_TOKEN:}
google.webhook-secret=${GOOGLE_WEBHOOK_SECRET:}
linkedin.webhook-secret=${LINKEDIN_WEBHOOK_SECRET:}

# Jackson JSON Serialization Settings
spring.jackson.serialization.fail-on-empty-beans=false

# Google Gemini AI Platform Configuration (Environment Override Ready)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
gemini.api.timeout-ms=${GEMINI_TIMEOUT:30000}
gemini.api.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:2048}
gemini.api.temperature=${GEMINI_TEMPERATURE:0.7}
gemini.api.rate-limit-per-minute=${AI_RATE_LIMIT:60}

# Firebase Admin SDK Configuration (Server-Side Only)
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
app.firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
app.firebase.project-id=${FIREBASE_PROJECT_ID:oho-tech}
app.firebase.api-key=${FIREBASE_API_KEY:}

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.ohotech.backend=DEBUG
