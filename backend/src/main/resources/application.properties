spring.application.name=backend
server.port=${PORT:8080}

# Spring Profiles Active Default
spring.profiles.active=dev

# Database Connection (PostgreSQL 17 on Port 5432 with Env Overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/OHOTECH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Flyway Database Migration Configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Security & JWT Configuration (Environment Override Ready)
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentPhaseThatIsLongEnoughAndSecure32Bytes!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.security.max-failed-logins=${MAX_FAILED_LOGINS:5}
app.security.lockout-duration-minutes=${LOCKOUT_DURATION_MINUTES:15}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# SMTP / Email Configuration (Resend / Custom SMTP Environment Override Ready)
spring.mail.host=${SPRING_MAIL_HOST:smtp.resend.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:resend}
spring.mail.password=${SPRING_MAIL_PASSWORD:${RESEND_API_KEY:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_PROPERTIES_MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_PROPERTIES_MAIL_SSL_TRUST:smtp.resend.com}
app.mail.from-email=${MAIL_FROM:${SPRING_MAIL_FROM_ADDRESS:noreply@ohotechn.com}}
app.mail.from-name=${MAIL_FROM_NAME:OHO TECHN}

# Payment Gateway Configuration (Razorpay Environment Override Ready)
app.razorpay.key-id=${RAZORPAY_KEY_ID:PROD_RAZORPAY_KEY_ID_PLACEHOLDER}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:PROD_RAZORPAY_KEY_SECRET_PLACEHOLDER}

# Webhook Ad Integration Secrets (Environment Override Ready)
meta.app-secret=${META_APP_SECRET:}
meta.verify-token=${META_VERIFY_TOKEN:}
google.webhook-secret=${GOOGLE_WEBHOOK_SECRET:}
linkedin.webhook-secret=${LINKEDIN_WEBHOOK_SECRET:}

# Cloud Object Storage Configuration (Local, S3, R2, MinIO)
app.storage.provider=${STORAGE_PROVIDER:LOCAL}
app.storage.local.base-dir=${STORAGE_LOCAL_BASE_DIR:./storage}
app.storage.s3.bucket=${AWS_S3_BUCKET:ohotech-releases}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.endpoint=${AWS_S3_ENDPOINT:}
app.storage.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.s3.path-style=${AWS_S3_PATH_STYLE:false}

# Jackson JSON Serialization Settings
spring.jackson.serialization.fail-on-empty-beans=false

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.ohotech.backend=INFO
