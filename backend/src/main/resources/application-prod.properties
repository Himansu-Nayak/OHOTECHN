# OHO TECHN - Production Profile Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none

# Strict Flyway Migration in Production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Production Logging Levels
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.ohotech.backend=INFO

# S3 Object Storage Provider Default for Production
app.storage.provider=${STORAGE_PROVIDER:S3}

# Production SMTP / Resend Defaults (Port 465 SSL, STARTTLS disabled)
spring.mail.host=${SPRING_MAIL_HOST:smtp.resend.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:resend}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_PROPERTIES_MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_STARTTLS_ENABLE:false}

# Production Error Handling: Mask stack traces in responses
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
